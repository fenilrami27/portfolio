    <!-- Inline theme script to prevent flash of unstyled theme (FOUT/FOUC) -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('fenil_portfolio_theme');
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = stored ? stored : (systemDark ? 'dark' : 'light');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            var meta = document.getElementById('theme-color-meta');
            if (meta) meta.setAttribute('content', '#0B0E14');
          } else {
            document.documentElement.classList.remove('dark');
            var meta = document.getElementById('theme-color-meta');
            if (meta) meta.setAttribute('content', '#F6F7FB');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
